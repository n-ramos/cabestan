# Tests joués sur chaque PR et sur main : ce sont les contrôles exigés par la
# protection de branche, une PR ne peut pas fusionner s'ils échouent.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  front:
    name: front
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  rust:
    name: rust
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test
        working-directory: src-tauri
